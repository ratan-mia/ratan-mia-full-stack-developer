name: CI / CD

on:
  push:
    branches: [portfolio-refresh]
  pull_request:
    branches: [portfolio-refresh]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force App Platform rebuild
        type: boolean
        default: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          NPM_CONFIG_PRODUCTION: 'false'

  deploy:
    name: Deploy DigitalOcean
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create App Platform deployment
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'true' }}
        run: |
          set -euo pipefail
          if [ "${FORCE_REBUILD}" = "true" ]; then
            doctl apps create-deployment "$DO_APP_ID" --force-rebuild --wait
          else
            doctl apps create-deployment "$DO_APP_ID" --wait
          fi

      - name: Verify live site
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://ratanmia.pro/ || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not return 200"
          exit 1
